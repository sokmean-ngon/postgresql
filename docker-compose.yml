services:
  postgres:
    image: percona/percona-distribution-postgresql:18.4
    container_name: postgres
    hostname: postgres

    init: true

    restart: unless-stopped
    stop_grace_period: 5m
    shm_size: 8gb

    ports:
      - "5432:5432"

    env_file:
      - .env

    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d postgres -tAc 'SELECT 1' >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./conf/pgbackrest.conf:/etc/postgresql/pgbackrest.conf:ro
      - ./data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
      - ./wal-archive:/wal_archive
      - ./pgbackrest-spool:/var/lib/pgbackrest/spool

    networks:
      - postgres-network

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

    tmpfs:
      - /tmp

  pmm-client:
    image: percona/pmm-client:3.8.1
    container_name: pmm-client
    hostname: postgres-node

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # PMM Client will automatically use these to connect on boot
      - PMM_AGENT_SERVER_ADDRESS=${PMM_SERVER_IP}
      - PMM_AGENT_SERVER_USERNAME=${PMM_SERVER_USER}
      - PMM_AGENT_SERVER_PASSWORD=${PMM_SERVER_PASSWORD}
      - PMM_AGENT_SERVER_INSECURE_TLS=1
      - PMM_AGENT_SETUP=1
      - PMM_AGENT_CONFIG_FILE=/srv/pmm-agent.yaml

    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pmm-client:/srv:rw

    networks:
      - postgres-network

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  postgres-network:
    driver: bridge