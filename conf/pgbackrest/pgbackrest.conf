[global]
repo1-type=s3
repo1-path=/postgres-backup

repo1-s3-bucket=postgres-backup
repo1-s3-endpoint=obs.example
repo1-s3-region=pp
repo1-s3-uri-style=path

repo1-s3-key=key
repo1-s3-key-secret=secret

#repo1-storage-verify-tls=y
repo1-s3-verify-tls=y

repo1-retention-full=14
repo1-retention-archive=14

repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3

process-max=2
start-fast=y

log-level-console=info
log-level-file=detail 

archive-async=y 
spool-path=/var/lib/pgbackrest/spool

[global:archive-push]
compress-level=3

[main]
pg1-path=/var/lib/postgresql/data/pg_cluster