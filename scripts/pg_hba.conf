```conf
###############################################################################
# PostgreSQL Client Authentication Configuration File
#
# Authentication:
#   - scram-sha-256 for all password authentication
#   - Local administration via Unix socket
#   - Replication only from trusted standby servers
###############################################################################

###############################################################################
# Local connections
###############################################################################

# Unix socket
local   all             postgres                                peer
local   all             all                                     peer

###############################################################################
# IPv4 localhost
###############################################################################

host    all             all             127.0.0.1/32            scram-sha-256

###############################################################################
# IPv6 localhost
###############################################################################

host    all             all             ::1/128                 scram-sha-256

###############################################################################
# Application Servers
#
# Replace these subnets with your production application network(s).
###############################################################################

host    all             all             10.10.10.0/24           scram-sha-256

###############################################################################
# Management Network (optional)
###############################################################################

host    all             all             10.10.20.0/24           scram-sha-256

###############################################################################
# Replication
#
# Replace with the IP addresses of your standby servers.
###############################################################################

host    replication     replicator      10.10.30.11/32          scram-sha-256
host    replication     replicator      10.10.30.12/32          scram-sha-256

###############################################################################
# Monitoring (PMM)
#
# Restrict PMM access to the monitoring subnet or server.
###############################################################################

host    all             pmm             10.10.40.10/32          scram-sha-256

###############################################################################
# End of file
###############################################################################
```
